<!DOCTYPE html>
<html lang="ru" id="html-lang" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>New Tab</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png?v=3">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png?v=3">
    <script src="theme-boot.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toolbar" role="toolbar">
        <button type="button" class="toolbar-btn" id="import-tab-btn" title="Импорт" aria-label="Импорт">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M12 11v6M9 14h6"/></svg>
        </button>
        <button type="button" class="toolbar-btn" id="export-btn" title="Экспорт" aria-label="Экспорт">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        </button>
        <button type="button" class="toolbar-btn" id="settings-btn" title="Настройки" aria-label="Настройки">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
        <input type="file" id="import-input" accept=".json,.html,.htm" hidden>
    </div>

    <main class="container">
        <section class="search-section">
            <div class="search-engine-selector" aria-label="Поисковые системы"></div>
            <div class="search-container">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="text" id="search-input" placeholder="Поиск в интернете..." autocomplete="off" autofocus aria-label="Поиск">
                <button type="button" id="image-search-btn" class="image-search-btn" aria-label="Поиск по картинке" title="Поиск по картинке">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                    <input type="file" id="image-search-input" accept="image/*" hidden>
                </button>
                <button type="button" id="search-btn" aria-label="Поиск">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </section>

        <nav class="categories-section" aria-label="Разделы">
            <div class="categories-tabs" id="categories-tabs"></div>
            <button type="button" class="add-category-btn" id="add-category-btn" title="Добавить категорию" aria-label="Добавить категорию">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </nav>

        <section class="links-section">
            <div class="links-grid" id="links-grid">
                <button type="button" class="add-link-btn" id="add-link-btn" title="Добавить ссылку" aria-label="Добавить ссылку">
                    <span class="add-link-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
                </button>
            </div>
        </section>
    </main>

    <!-- Modal for Add/Edit Link -->
    <div id="link-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <button type="button" class="close" aria-label="Закрыть">&times;</button>
            <h2 id="modal-title" data-i18n="addLink">Добавить ссылку</h2>
            <form id="link-form">
                <div class="form-group">
                    <label for="link-url" data-i18n="linkUrl">URL</label>
                    <input type="text" id="link-url" placeholder="example.com или https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="link-name" data-i18n="linkName">Название</label>
                    <input type="text" id="link-name" placeholder="Название ссылки" required>
                </div>
                <div class="form-group">
                    <label for="link-category" data-i18n="linkCategory">Категория</label>
                    <select id="link-category" required></select>
                </div>
                <div class="form-group">
                    <label for="link-icon" data-i18n="linkIcon">Иконка (необязательно)</label>
                    <div class="icon-field">
                        <div class="link-icon icon-preview" id="link-icon-preview" aria-hidden="true"></div>
                        <input type="text" id="link-icon" data-i18n="linkIconPlaceholder" placeholder="URL картинки или загрузите файл">
                        <button type="button" class="ghost-btn" id="link-icon-upload" data-i18n="uploadIcon">Загрузить</button>
                        <button type="button" class="ghost-btn" id="link-icon-reset" data-i18n="resetIcon">Сбросить</button>
                        <input type="file" id="link-icon-file" accept="image/*" hidden>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel-btn" data-i18n="cancel">Отмена</button>
                    <button type="submit" id="submit-btn" data-i18n="add">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add/Edit Category -->
    <div id="category-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
        <div class="modal-content">
            <button type="button" class="close" aria-label="Закрыть">&times;</button>
            <h2 id="category-modal-title" data-i18n="addCategory">Добавить категорию</h2>
            <form id="category-form">
                <div class="form-group">
                    <label for="category-name" data-i18n="categoryName">Название категории</label>
                    <input type="text" id="category-name" placeholder="Название категории" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel-btn" data-i18n="cancel">Отмена</button>
                    <button type="submit" id="category-submit-btn" data-i18n="add">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Import -->
    <div id="import-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="import-modal-title">
        <div class="modal-content modal-wide">
            <button type="button" class="close" aria-label="Закрыть">&times;</button>
            <h2 id="import-modal-title" data-i18n="importTabs">Импорт</h2>
            <div id="import-content"></div>
            <div class="modal-buttons">
                <button type="button" class="cancel-btn" data-i18n="cancel">Отмена</button>
                <button type="button" id="import-submit-btn" class="import-submit-btn" data-i18n="importSelected">Импортировать выбранные</button>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Edit Search Engine -->
    <div id="search-engine-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="search-engine-modal-title">
        <div class="modal-content modal-wide">
            <button type="button" class="close" aria-label="Закрыть">&times;</button>
            <h2 id="search-engine-modal-title" data-i18n="addSearchEngine">Добавить поисковую систему</h2>
            <div class="form-group">
                <div class="section-label" data-i18n="presets">Популярные</div>
                <p class="hint" data-i18n="presetsHint">Нажмите, чтобы добавить, или заполните поля вручную</p>
                <div class="preset-grid" id="search-engine-presets"></div>
            </div>
            <form id="search-engine-form">
                <input type="hidden" id="search-engine-icon">
                <div class="form-group">
                    <label for="search-engine-name" data-i18n="searchEngineName">Название</label>
                    <input type="text" id="search-engine-name" placeholder="Например: Google" required>
                </div>
                <div class="form-group">
                    <label for="search-engine-url" data-i18n="searchEngineUrl">URL поиска</label>
                    <input type="text" id="search-engine-url" placeholder="https://www.google.com/search?q={query}" required>
                    <small class="hint" data-i18n="queryPlaceholder">Используйте {query} вместо поискового запроса</small>
                </div>
                <div class="form-group">
                    <label for="search-engine-image-url" data-i18n="searchEngineImageUrl">URL поиска по картинке (опционально)</label>
                    <input type="text" id="search-engine-image-url" placeholder="https://lens.google.com/uploadbyurl?url={query}">
                    <small class="hint" data-i18n="imageQueryPlaceholder">Используйте {query} для URL изображения</small>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="cancel-btn" data-i18n="cancel">Отмена</button>
                    <button type="submit" id="search-engine-submit-btn" data-i18n="add">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Settings -->
    <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content modal-wide">
            <button type="button" class="close" aria-label="Закрыть">&times;</button>
            <h2 id="settings-title" data-i18n="settings">Настройки</h2>

            <div class="settings-group">
                <div class="section-label" data-i18n="appearance">Оформление</div>
                <div class="setting-row">
                    <span class="setting-name" data-i18n="theme">Тема</span>
                    <div class="segmented" role="group">
                        <button type="button" data-setting="theme" data-value="auto" data-i18n="themeAuto">Авто</button>
                        <button type="button" data-setting="theme" data-value="light" data-i18n="themeLight">Светлая</button>
                        <button type="button" data-setting="theme" data-value="sand" data-i18n="themeSand">Песочная</button>
                        <button type="button" data-setting="theme" data-value="dark" data-i18n="themeDark">Тёмная</button>
                        <button type="button" data-setting="theme" data-value="midnight" data-i18n="themeMidnight">Чёрная</button>
                    </div>
                </div>
                <div class="setting-row">
                    <span class="setting-name" data-i18n="accentColor">Акцентный цвет</span>
                    <div class="accent-swatches" id="accent-swatches"></div>
                </div>
                <div class="setting-row">
                    <span class="setting-name" data-i18n="density">Размер плиток</span>
                    <div class="segmented" role="group">
                        <button type="button" data-setting="density" data-value="compact" data-i18n="densityCompact">Компактные</button>
                        <button type="button" data-setting="density" data-value="comfortable" data-i18n="densityComfortable">Обычные</button>
                        <button type="button" data-setting="density" data-value="large" data-i18n="densityLarge">Крупные</button>
                    </div>
                </div>
            </div>

            <div class="settings-group">
                <div class="section-label" data-i18n="behavior">Поведение</div>
                <label class="setting-row toggle-row">
                    <span class="setting-name" data-i18n="openInNewTab">Открывать ссылки в новой вкладке</span>
                    <input type="checkbox" class="switch" data-setting="openInNewTab">
                </label>
                <div class="setting-row">
                    <label class="setting-name" for="language-select" data-i18n="language">Язык</label>
                    <select id="language-select">
                    <optgroup label="Western Europe">
                        <option value="en">English</option>
                        <option value="de">Deutsch (German)</option>
                        <option value="fr">Français (French)</option>
                        <option value="es">Español (Spanish)</option>
                        <option value="it">Italiano (Italian)</option>
                        <option value="pt">Português (Portuguese)</option>
                        <option value="nl">Nederlands (Dutch)</option>
                    </optgroup>
                    <optgroup label="Northern Europe">
                        <option value="sv">Svenska (Swedish)</option>
                        <option value="da">Dansk (Danish)</option>
                        <option value="no">Norsk (Norwegian)</option>
                        <option value="fi">Suomi (Finnish)</option>
                        <option value="is">Íslenska (Icelandic)</option>
                    </optgroup>
                    <optgroup label="Eastern Europe">
                        <option value="ru">Русский (Russian)</option>
                        <option value="uk">Українська (Ukrainian)</option>
                        <option value="pl">Polski (Polish)</option>
                        <option value="cs">Čeština (Czech)</option>
                        <option value="sk">Slovenčina (Slovak)</option>
                        <option value="hu">Magyar (Hungarian)</option>
                        <option value="ro">Română (Romanian)</option>
                        <option value="bg">Български (Bulgarian)</option>
                    </optgroup>
                    <optgroup label="Baltic States">
                        <option value="lv">Latviešu (Latvian)</option>
                        <option value="lt">Lietuvių (Lithuanian)</option>
                        <option value="et">Eesti (Estonian)</option>
                    </optgroup>
                    <optgroup label="Balkans">
                        <option value="sr">Српски (Serbian)</option>
                        <option value="hr">Hrvatski (Croatian)</option>
                        <option value="sl">Slovenščina (Slovenian)</option>
                        <option value="el">Ελληνικά (Greek)</option>
                    </optgroup>
                    <optgroup label="Other">
                        <option value="tr">Türkçe (Turkish)</option>
                        <option value="mt">Malti (Maltese)</option>
                        <option value="ga">Gaeilge (Irish)</option>
                    </optgroup>
                </select>
                </div>
            </div>

            <div class="settings-group">
                <div class="section-label" data-i18n="data">Данные</div>
                <div class="settings-actions">
                    <button type="button" class="ghost-btn" id="settings-presets-btn" data-i18n="presetsOpen">Готовые наборы ссылок</button>
                    <button type="button" class="ghost-btn" id="settings-import-btn" data-i18n="import">Импорт</button>
                    <button type="button" class="ghost-btn" id="settings-export-btn" data-i18n="exportBackup">Скачать резервную копию</button>
                </div>
            </div>

            <div class="modal-buttons">
                <button type="button" class="cancel-btn" data-i18n="done">Готово</button>
            </div>
        </div>
    </div>

    <script src="brand-icons.js"></script>
    <script src="script.js"></script>
    <script src="features.js"></script>
    <script src="presets.js"></script>
</body>
</html>
